<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Azure Agentic AI Platform</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f0f2f5;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    header {
      width: 100%;
      background: #0078d4;
      color: #fff;
      padding: 1rem 2rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    header h1 { font-size: 1.25rem; font-weight: 600; }
    header span { font-size: 0.8rem; opacity: 0.8; margin-left: auto; }

    .chat-container {
      width: 100%;
      max-width: 760px;
      display: flex;
      flex-direction: column;
      flex: 1;
      padding: 1.5rem 1rem;
      gap: 1rem;
    }

    .messages {
      flex: 1;
      background: #fff;
      border-radius: 12px;
      padding: 1.25rem;
      min-height: 420px;
      max-height: 520px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      box-shadow: 0 1px 4px rgba(0,0,0,.08);
    }

    .message {
      max-width: 80%;
      padding: 0.6rem 1rem;
      border-radius: 18px;
      line-height: 1.5;
      font-size: 0.925rem;
    }

    .message.bot {
      background: #e8f0fe;
      color: #1a1a2e;
      align-self: flex-start;
      border-bottom-left-radius: 4px;
    }

    .message.user {
      background: #0078d4;
      color: #fff;
      align-self: flex-end;
      border-bottom-right-radius: 4px;
    }

    .input-row {
      display: flex;
      gap: 0.5rem;
    }

    .input-row input {
      flex: 1;
      padding: 0.75rem 1rem;
      border: 1px solid #d0d7de;
      border-radius: 24px;
      font-size: 0.925rem;
      outline: none;
      transition: border-color .2s;
    }

    .input-row input:focus { border-color: #0078d4; }

    .input-row button {
      padding: 0.75rem 1.4rem;
      background: #0078d4;
      color: #fff;
      border: none;
      border-radius: 24px;
      font-size: 0.925rem;
      cursor: pointer;
      transition: background .2s;
    }

    .input-row button:hover { background: #005fa3; }

    .status-bar {
      font-size: 0.78rem;
      color: #888;
      text-align: center;
    }

    .status-bar span { color: #e74c3c; }
    .status-bar span.ok { color: #27ae60; }
  </style>
</head>
<body>
  <header>
    <h1>🤖 Azure Agentic AI Platform</h1>
    <span>Boilerplate v0.1.0</span>
  </header>

  <div class="chat-container">
    <div class="messages" id="messages">
      <div class="message bot">
        👋 Welcome! This is a placeholder chatbot interface.
        AI functionality will be implemented in upcoming feature branches
        (LangChain RAG &amp; LangGraph multi-agent).
      </div>
    </div>

    <div class="input-row">
      <input
        type="text"
        id="userInput"
        placeholder="Type a message… (AI not yet connected)"
        autocomplete="off"
      />
      <button id="sendBtn">Send</button>
    </div>

    <div class="status-bar" id="statusBar">
      Backend status: checking…
    </div>
  </div>

  <script>
    const messagesEl = document.getElementById('messages');
    const userInput  = document.getElementById('userInput');
    const sendBtn    = document.getElementById('sendBtn');
    const statusBar  = document.getElementById('statusBar');

    function appendMessage(text, role) {
      const div = document.createElement('div');
      div.classList.add('message', role);
      div.textContent = text;
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    sendBtn.addEventListener('click', () => {
      const text = userInput.value.trim();
      if (!text) return;
      appendMessage(text, 'user');
      userInput.value = '';
      setTimeout(() => {
        appendMessage(
          '⚙️ AI backend not yet connected. Check back after the LangChain / LangGraph feature branches are merged.',
          'bot'
        );
      }, 400);
    });

    userInput.addEventListener('keydown', e => {
      if (e.key === 'Enter') sendBtn.click();
    });

    // Health-check ping
    async function checkHealth() {
      try {
        const res = await fetch('/health');
        if (res.ok) {
          const data = await res.json();
          statusBar.innerHTML = `Backend status: <span class="ok">● ${data.status}</span> — ${data.service} (${data.environment})`;
        } else {
          statusBar.innerHTML = 'Backend status: <span>● unreachable</span>';
        }
      } catch {
        statusBar.innerHTML = 'Backend status: <span>● unreachable</span>';
      }
    }

    checkHealth();
  </script>
</body>
</html>
